name: axiz-identity
services:
  postgres-keycloak:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - keycloak-pgdata:/var/lib/postgresql
      - ./postgres-keycloak-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -q"]
      interval: 10s
      timeout: 5s
      retries: 15
  postgres-external:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${EXTERNAL_POSTGRES_PASSWORD:?}
      PHONE_DB_PASSWORD: ${PHONE_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - external-pgdata:/var/lib/postgresql
      - ./postgres-external-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ../datasets:/datasets:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -q"]
      interval: 10s
      timeout: 5s
      retries: 15
  keycloak:
    image: axiz/keycloak:1.1.0
    build:
      context: ..
      dockerfile: infraestructura/Dockerfile.keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_ACCESS_LOG_ENABLED: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?}
      PHONE_DB_URL: jdbc:postgresql://postgres-external:5432/phone_identity
      PHONE_DB_USER: phone_reader
      PHONE_DB_PASSWORD: ${PHONE_DB_PASSWORD:?}
      PASSWORD_CLIENT_SECRET: ${PASSWORD_CLIENT_SECRET:?}
      PHONE_CLIENT_SECRET: ${PHONE_CLIENT_SECRET:?}
    volumes: ["../datasets/axiz-realm.json:/opt/keycloak/data/import/axiz-realm.json:ro"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres-keycloak: {condition: service_healthy}
      postgres-external: {condition: service_healthy}
  seed-keycloak:
    image: python:3.14.8-alpine
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?}
      DNI_PASSWORD: ${DNI_PASSWORD:?}
    command: [python3, /seed-keycloak.py]
    volumes: ["./seed-keycloak.py:/seed-keycloak.py:ro"]
    depends_on: [keycloak]
  payments:
    image: axiz/payments:1.1.0
    profiles: [app]
    build:
      context: ..
      dockerfile: infraestructura/Dockerfile.payment
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://postgres-external:5432/payments
      PAYMENT_DB_USER: payments
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    ports: ["127.0.0.1:8090:8090"]
    depends_on:
      postgres-external: {condition: service_healthy}
      seed-keycloak: {condition: service_completed_successfully}
  routes:
    image: curlimages/curl:8.19.0
    profiles: [app]
    entrypoint: [sh, -c]
    command:
      - >-
        until curl -fsS http://payments:8090/ready >/dev/null 2>&1; do sleep 3; done;
        sh /routes.sh;
    volumes: ["./routes.sh:/routes.sh:ro"]
    depends_on: [payments]
volumes:
  keycloak-pgdata:
  external-pgdata:
