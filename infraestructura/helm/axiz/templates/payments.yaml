apiVersion: v1
kind: Service
metadata: {name: payments}
spec:
  type: NodePort
  selector: {app: payments}
  ports:
    - {name: http, port: 8090, targetPort: 8090, nodePort: 30090}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payments}
spec:
  replicas: 1
  selector:
    matchLabels: {app: payments}
  template:
    metadata:
      labels: {app: payments}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      initContainers:
        - name: wait-postgres
          image: {{ .Values.images.postgres | quote }}
          command: [sh, -c, "until pg_isready -h postgres -U payments -q; do sleep 2; done"]
      containers:
        - name: payments
          image: {{ .Values.images.payments | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: PAYMENT_DB_PASSWORD, valueFrom: {secretKeyRef: {name: axiz-credentials, key: PAYMENT_DB_PASSWORD}}}
            - {name: PAYMENT_DB_URL, value: "jdbc:postgresql://postgres:5432/payments"}
            - {name: PAYMENT_DB_USER, value: payments}
            - {name: KEYCLOAK_PUBLIC_URL, value: {{ .Values.publicUrl | quote }}}
            - {name: KEYCLOAK_INTERNAL_URL, value: "http://keycloak:8080"}
          ports: [{containerPort: 8090}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          startupProbe:
            httpGet: {path: /ready, port: 8090}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /ready, port: 8090}
            periodSeconds: 10
