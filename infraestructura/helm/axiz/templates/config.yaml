apiVersion: v1
kind: ConfigMap
metadata: {name: axiz-datasets}
data:
  axiz-realm.json: |
{{ .Files.Get "files/axiz-realm.json" | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata: {name: axiz-credentials}
type: Opaque
stringData:
  KC_DB_PASSWORD: {{ required "Se requiere la contraseña Keycloak DB" .Values.credentials.keycloak | quote }}
  PHONE_DB_PASSWORD: {{ required "Se requiere la contraseña externa" .Values.credentials.phone | quote }}
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.credentials.adminUser | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ required "Se requiere la contraseña administrativa" .Values.credentials.adminPassword | quote }}
  PASSWORD_CLIENT_SECRET: {{ required "Se requiere el secreto DNI" .Values.credentials.passwordClient | quote }}
  PHONE_CLIENT_SECRET: {{ required "Se requiere el secreto telefónico" .Values.credentials.phoneClient | quote }}
