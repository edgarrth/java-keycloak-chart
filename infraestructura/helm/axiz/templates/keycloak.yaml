apiVersion: v1
kind: Service
metadata: {name: keycloak}
spec:
  type: NodePort
  selector: {app: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30080}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: keycloak}
spec:
  serviceName: keycloak
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
      annotations:
        checksum/realm: {{ .Files.Get "files/axiz-realm.json" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      initContainers:
        - name: wait-postgres
          image: {{ .Values.images.postgres | quote }}
          command: [sh, -c, "until pg_isready -h postgres -U keycloak -q; do sleep 2; done"]
          securityContext: {allowPrivilegeEscalation: false}
      containers:
        - name: keycloak
          image: {{ .Values.images.keycloak | quote }}
          imagePullPolicy: IfNotPresent
          args: [start, --optimized, --import-realm]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            {{- range $name := list "KC_DB_PASSWORD" "PHONE_DB_PASSWORD" "KC_BOOTSTRAP_ADMIN_USERNAME" "KC_BOOTSTRAP_ADMIN_PASSWORD" "DNI_PASSWORD" "PASSWORD_CLIENT_SECRET" "PHONE_CLIENT_SECRET" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef: {name: axiz-credentials, key: {{ $name }}}
            {{- end }}
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: "jdbc:postgresql://postgres:5432/keycloak"}
            - {name: KC_DB_USERNAME, value: keycloak}
            - {name: KC_HOSTNAME, value: {{ .Values.publicUrl | quote }}}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: PHONE_DB_URL, value: "jdbc:postgresql://postgres:5432/phone_identity"}
            - {name: PHONE_DB_USER, value: phone_reader}
          ports: [{containerPort: 8080}, {containerPort: 9000}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1536Mi}
          startupProbe:
            httpGet: {path: /health/started, port: 9000}
            failureThreshold: 90
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: 9000}
            periodSeconds: 30
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import/axiz-realm.json, subPath: axiz-realm.json, readOnly: true}
      volumes:
        - name: realm
          configMap: {name: axiz-datasets}
