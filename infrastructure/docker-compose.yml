name: axiz-identity
services:
  java-build-base:
    scale: 0
    image: axiz/java-build-base:1.1.0
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.base
  keycloak:
    scale: 0
    image: axiz/keycloak:1.1.0
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.keycloak
      additional_contexts:
        java_build_base: service:java-build-base
  postgres-keycloak:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - keycloak-pgdata:/var/lib/postgresql
      - ./datasets/postgres-keycloak-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -q"]
      interval: 10s
      timeout: 5s
      retries: 15
  postgres-external:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${EXTERNAL_POSTGRES_PASSWORD:?}
      PHONE_DB_PASSWORD: ${PHONE_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - external-pgdata:/var/lib/postgresql
      - ./postgres-external-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./datasets:/datasets:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -q"]
      interval: 10s
      timeout: 5s
      retries: 15
  payments:
    profiles: [app]
    image: axiz/payments:1.1.0
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.payment
      additional_contexts:
        java_build_base: service:java-build-base
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://postgres-external:5432/payments
      PAYMENT_DB_USER: payments
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: http://axiz-control-plane:30080
    ports: ["127.0.0.1:8090:8090"]
    networks: [default, kind]
    depends_on:
      postgres-external: {condition: service_healthy}
  seed-keycloak:
    profiles: [tasks]
    image: python:3.14.8-alpine
    networks: [kind]
    environment:
      KEYCLOAK_INTERNAL_URL: http://axiz-control-plane:30080
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?}
      DNI_PASSWORD: ${DNI_PASSWORD:?}
    command: [python3, /seed-keycloak.py]
    volumes: ["./seed-keycloak.py:/seed-keycloak.py:ro"]
networks:
  kind:
    external: true
    name: kind
volumes:
  keycloak-pgdata:
  external-pgdata:
