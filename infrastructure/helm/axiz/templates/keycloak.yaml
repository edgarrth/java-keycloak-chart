apiVersion: v1
kind: Service
metadata: {name: keycloak}
spec:
  selector: {app: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: keycloak}
spec:
  serviceName: keycloak
  replicas: {{ .Values.keycloak.replicas }}
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
      annotations:
        checksum/credentials: {{ toJson .Values.credentials | sha256sum }}
        checksum/database: {{ toJson .Values.database | sha256sum }}
        checksum/image: {{ .Values.images.keycloakRevision | quote }}
        checksum/realm: {{ .Files.Get "files/axiz-realm.json" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000}
      containers:
        - name: keycloak
          image: {{ .Values.images.keycloak | quote }}
          imagePullPolicy: IfNotPresent
          args: [start, --optimized, --import-realm]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            {{- range $name := list "KC_DB_PASSWORD" "PHONE_DB_PASSWORD" "KC_BOOTSTRAP_ADMIN_USERNAME" "KC_BOOTSTRAP_ADMIN_PASSWORD" "PASSWORD_CLIENT_SECRET" "PHONE_CLIENT_SECRET" }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef: {name: axiz-credentials, key: {{ $name }}}
            {{- end }}
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: {{ required "Se requiere una URL externa para Keycloak" .Values.database.keycloakUrl | quote }}}
            - {name: KC_DB_USERNAME, value: keycloak}
            - {name: KC_HOSTNAME, value: {{ .Values.publicUrl | quote }}}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HTTP_ACCESS_LOG_ENABLED, value: "false"}
            - {name: KC_CACHE, value: ispn}
            - {name: KC_CACHE_EMBEDDED_MTLS_ENABLED, value: "true"}
            - name: KC_CACHE_EMBEDDED_NETWORK_BIND_ADDRESS
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: KC_CACHE_EMBEDDED_NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - {name: PHONE_DB_URL, value: {{ required "Se requiere una URL externa telefónica" .Values.database.phoneUrl | quote }}}
            - {name: PHONE_DB_USER, value: phone_reader}
          ports: [{name: http, containerPort: 8080}, {name: management, containerPort: 9000}, {name: cluster, containerPort: 7800}, {name: failure, containerPort: 57800}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1536Mi}
          startupProbe:
            httpGet: {path: /health/started, port: 9000}
            failureThreshold: 90
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: 9000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: 9000}
            periodSeconds: 30
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import/axiz-realm.json, subPath: axiz-realm.json, readOnly: true}
      volumes:
        - name: realm
          configMap: {name: axiz-datasets}
