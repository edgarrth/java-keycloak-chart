apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata: {name: axiz-proxy}
spec:
  telemetry:
    accessLog:
      disable: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: {name: axiz-envoy}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: axiz-proxy
    namespace: {{ .Release.Namespace }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: axiz-keycloak}
spec:
  gatewayClassName: axiz-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: axiz-keycloak}
spec:
  parentRefs: [{name: axiz-keycloak}]
  rules:
    {{- range $index := until (int .Values.keycloak.replicas) }}
    - matches:
        - path: {type: PathPrefix, value: /}
          headers:
            - {type: Exact, name: X-Axiz-Instance, value: {{ printf "keycloak-%d" $index | quote }}}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - {name: X-Axiz-Instance, value: {{ printf "keycloak-%d" $index | quote }}}
      backendRefs:
        - {name: {{ printf "keycloak-%d" $index }}, port: 8080}
    {{- end }}
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: keycloak, port: 8080}
